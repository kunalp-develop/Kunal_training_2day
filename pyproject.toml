[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "day2-ticket-pipeline"
version = "0.2.0"
description = "Day 2: support-ticket pipeline refactored into reusable OOP components"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
