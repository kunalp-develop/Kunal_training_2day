[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "day1-ticket-pipeline"
version = "0.1.0"
description = "Day 1 Python engineering and support-ticket data pipeline assignment"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
